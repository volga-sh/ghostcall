[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
optimizer = true
optimizer_runs = 1
bytecode_hash = "none"
cbor_metadata = false
evm_version = "prague"
solc_version = "0.8.37"

# The statement order in Ghostcall.yul gives the smallest code. An empty Yul
# optimizer sequence keeps that order. With this setting, the EVM code transform
# makes 61 bytes. With the default sequence, it makes 84 bytes. The peephole
# optimizer also operates.
[profile.default.optimizer_details]
yul = true
yulDetails = { optimizerSteps = ":" }

[lint]
lint_on_build = false
