<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<title>ghostcall documentation: Batch reads through one eth_call</title>
	<rect width="1200" height="630" fill="#f7f8fa" />
	<text x="64" y="76" fill="#202632" font-family="Georgia, serif" font-size="36" font-weight="700" letter-spacing="-1.5">ghostcall</text>
	<text x="1136" y="72" fill="#626b7a" font-family="Arial, sans-serif" font-size="18" text-anchor="end">ghostcall.volga.sh</text>
	<path d="M64 110H1136" stroke="#dde2e8" />
	<text x="64" y="168" fill="#3d5f9a" font-family="Arial, sans-serif" font-size="18" font-weight="600">A small primitive for EVM reads</text>
	<g fill="#202632" font-family="Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-3">
		<text x="60" y="268">Batch reads through</text>
		<text x="60" y="350">one eth_call.</text>
	</g>
	<text x="64" y="408" fill="#626b7a" font-family="Arial, sans-serif" font-size="24">No deployment. No onchain dependencies.</text>
	<rect x="64" y="464" width="1072" height="102" rx="12" fill="#ffffff" stroke="#dde2e8" />
	<text x="224" y="524" fill="#626b7a" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">Contract reads</text>
	<path d="M388 516h58m-8-8 8 8-8 8" fill="none" stroke="#a8b2c1" stroke-width="2" />
	<rect x="484" y="485" width="232" height="60" rx="8" fill="#eaf0fa" />
	<text x="600" y="522" fill="#2d497c" font-family="Menlo, Consolas, monospace" font-size="22" text-anchor="middle">1 eth_call</text>
	<path d="M754 516h58m-8-8 8 8-8 8" fill="none" stroke="#a8b2c1" stroke-width="2" />
	<text x="968" y="524" fill="#626b7a" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">Ordered results</text>
</svg>
